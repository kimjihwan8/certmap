# 로컬 개발용 DB.  켜기: docker compose up -d   끄기: docker compose down
# 데이터는 pgdata 볼륨에 남는다 (컨테이너를 지워도 유지). 완전히 지우려면 docker compose down -v
services:
  db:
    build: ./db
    image: restaurant-map-db
    environment:
      POSTGRES_USER: map
      POSTGRES_PASSWORD: map          # 내 컴퓨터에서만 쓰는 DB라 단순한 비밀번호. 배포할 땐 바꾼다
      POSTGRES_DB: restaurant_map
    ports:
      - "127.0.0.1:5432:5432"         # 127.0.0.1 = 이 컴퓨터에서만 접속 가능 (같은 와이파이의 다른 기기는 못 들어옴)
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
